name: Long Premium Scanner Unit Tests
on:
  pull_request:
    paths:
      - "long_premium/**"
      - ".github/workflows/long-premium-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile screener
        run: python -m py_compile long_premium/universe_screen.py
      - name: Run pure offline tests
        run: python -m unittest discover -s long_premium/tests -v
